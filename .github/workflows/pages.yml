# Bygger årshjulet fra src.html og publiserer nettsiden på GitHub Pages.
# Kjører hver gang noe endres på main, og kan startes for hånd under Actions.
name: Bygg og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg årshjulet
        run: python3 build.py
      - name: Sett sammen nettsiden
        run: |
          mkdir -p _site
          cp dist/arshjul.html dist/arshjul-enkel.html dist/arshjul-team.html _site/
          cp index.html favicon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
