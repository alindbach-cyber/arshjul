# Bygger årshjulet fra src.html og publiserer nettsiden på GitHub Pages.
# Kjører hver gang noe endres på main, og kan startes for hånd under Actions.
name: Bygg og publiser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lage utgivelser (Releases) med den ferdige appfilen
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bygg årshjulet
        run: python3 build.py
      - name: Sett sammen nettsiden
        run: |
          mkdir -p _site
          cp dist/arshjul.html dist/arshjul-enkel.html dist/arshjul-team.html _site/
          cp index.html favicon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Den ferdige appfilen legges ved utgivelsen for versjonen (f.eks. «Versjon 12»), så den kan lastes ned
      # som én fil. Finnes utgivelsen fra før, byttes filen ut.
      - name: Legg den ferdige filen ved utgivelsen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSION = \"(\\d+)\"', open('build.py').read()).group(1))")
          awk -v v="## Versjon $V " 'index($0,v)==1{p=1;next} /^## Versjon /{if(p)exit} p' CHANGELOG.md > notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/arshjul.html --clobber
          else
            gh release create "v$V" dist/arshjul.html --title "Versjon $V" --notes-file notes.md --target "$GITHUB_SHA"
          fi

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
